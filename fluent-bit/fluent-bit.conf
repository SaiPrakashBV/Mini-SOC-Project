# Fluent Bit: tail the target app's JSON log file and ship every record to
# OpenSearch as daily indices security-events-YYYY.MM.DD.

[SERVICE]
    Flush             2
    Log_Level         info
    Parsers_File      parsers.conf
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    Health_Check      On
    storage.path      /fluent-bit/state/buffer
    storage.sync      normal

[INPUT]
    Name              tail
    Tag               app.target
    Path              /var/log/target-app/app.json
    Parser            app_json
    DB                /fluent-bit/state/tail.db
    Refresh_Interval  2
    Read_from_Head    On
    Skip_Long_Lines   On
    Mem_Buf_Limit     20MB
    storage.type      filesystem

# Drop noisy framework start-up logs; keep audit events, access logs and warnings/errors.
[FILTER]
    Name              grep
    Match             app.*
    Logical_Op        or
    # Note: exactly one space between field name and pattern - extra spaces become
    # part of the regex and nothing matches.
    Regex             log_type ^security_audit$
    Regex             level ^(WARN|ERROR)$

[FILTER]
    Name              modify
    Match             app.*
    Add               pipeline fluent-bit

[OUTPUT]
    Name                opensearch
    Match               app.*
    Host                ${OPENSEARCH_HOST}
    Port                ${OPENSEARCH_PORT}
    # With the OpenSearch security plugin enabled, add:
    #   HTTP_User   ${OPENSEARCH_USER}
    #   HTTP_Passwd ${OPENSEARCH_PASSWORD}
    #   tls         On
    tls                 Off
    Logstash_Format     On
    Logstash_Prefix     security-events
    Logstash_DateFormat %Y.%m.%d
    Time_Key            @timestamp
    Time_Key_Nanos      Off
    Suppress_Type_Name  On
    Replace_Dots        On
    Generate_ID         On
    Retry_Limit         False
    Trace_Error         On

[OUTPUT]
    Name              stdout
    Match             app.*
    Format            json_lines
    # Comment this section out to silence the echo of shipped events.
