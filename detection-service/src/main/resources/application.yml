server:
  port: 8082
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: detection-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    # Same analyst accounts as the incident tracker so the dashboard uses one login.
    analysts:
      - username: analyst1
        password: ${ANALYST1_PASSWORD}
      - username: lead
        password: ${SOC_LEAD_PASSWORD}

detection:
  # ISO-8601 durations (PT15S = 15 seconds), as required by @Scheduled.
  poll-interval: ${DETECTION_POLL_INTERVAL:PT15S}
  initial-delay: PT20S
  opensearch:
    url: ${OPENSEARCH_URL:http://localhost:9200}
    username: ${OPENSEARCH_USER:}
    password: ${OPENSEARCH_PASSWORD:}
    event-index: security-events-*
    alert-index: soc-alerts
  tracker:
    url: ${TRACKER_URL:http://localhost:8081}
    api-key: ${TRACKER_API_KEY}
    enabled: true

  # ---------------------------------------------------------------------------
  # Detection rules. Each rule counts matching events per `group-by` value in a
  # sliding `window` and fires when the count reaches `threshold`.
  # ---------------------------------------------------------------------------
  rules:
    - id: BRUTE_FORCE_LOGIN
      name: Potential brute-force login
      description: Repeated failed logins against the same account in a short period.
      severity: HIGH
      window: 2m
      threshold: 5
      escalate-at: 20
      escalate-to: CRITICAL
      group-by: username
      match:
        event_type: [LOGIN_FAILURE]
      mitre: T1110.001

    - id: PASSWORD_SPRAY
      name: Password spraying from single source
      description: One source IP failing logins across many requests - typical of credential stuffing or spraying.
      severity: HIGH
      window: 5m
      threshold: 10
      group-by: source_ip
      match:
        event_type: [LOGIN_FAILURE]
      mitre: T1110.003

    - id: AUTH_ERROR_SPIKE
      name: Spike in 401/403 responses
      description: A source is receiving an unusual number of authentication/authorization errors.
      severity: MEDIUM
      window: 5m
      threshold: 15
      escalate-at: 60
      escalate-to: HIGH
      group-by: source_ip
      match:
        event_type: [HTTP_REQUEST]
        http_status: ["401", "403"]

    - id: HIGH_REQUEST_RATE
      name: Unusual request volume
      description: A single source exceeded the normal request rate (possible scraping, enumeration or DoS).
      severity: MEDIUM
      window: 1m
      threshold: 100
      escalate-at: 500
      escalate-to: HIGH
      group-by: source_ip
      match:
        event_type: [HTTP_REQUEST]
      mitre: T1498

    - id: RESTRICTED_ENDPOINT_ACCESS
      name: Attempted access to admin endpoints
      description: A non-admin principal repeatedly tried to reach restricted /api/admin resources.
      severity: HIGH
      window: 5m
      threshold: 3
      group-by: username
      match:
        event_type: [ACCESS_DENIED]
      path-prefix: /api/admin
      mitre: T1068

    - id: IDOR_ATTEMPT
      name: Access to other users' resources
      description: A user repeatedly requested objects they do not own (possible IDOR enumeration).
      severity: HIGH
      window: 10m
      threshold: 3
      group-by: username
      match:
        event_type: [RESOURCE_OWNERSHIP_VIOLATION]
      mitre: T1087

    - id: INVALID_TOKEN_ABUSE
      name: Repeated invalid JWTs
      description: Many forged, tampered or expired tokens from one source.
      severity: MEDIUM
      window: 5m
      threshold: 10
      group-by: source_ip
      match:
        event_type: [TOKEN_INVALID]
      mitre: T1550.001

    # ----------------------------------------------------------------------
    # Advanced detections: correlation (require), cardinality (distinct-field)
    # and payload-signature events from the target app's input inspection.
    # ----------------------------------------------------------------------
    - id: ACCOUNT_TAKEOVER
      name: Successful login after repeated failures
      description: >-
        A source IP failed to log in repeatedly and then succeeded - the password was
        probably guessed or stuffed. Treat the account as compromised.
      severity: CRITICAL
      window: 10m
      threshold: 5
      group-by: source_ip
      match:
        event_type: [LOGIN_FAILURE]
      require:
        event_type: [LOGIN_SUCCESS]
      mitre: T1110 / T1078

    - id: DISTRIBUTED_BRUTE_FORCE
      name: Distributed brute force on one account
      description: Failed logins for the same account from many different IPs (botnet / proxy rotation).
      severity: HIGH
      window: 10m
      threshold: 5
      group-by: username
      distinct-field: source_ip
      min-distinct: 5
      match:
        event_type: [LOGIN_FAILURE]
      mitre: T1110.004

    - id: SESSION_HIJACK
      name: Session token used from multiple IPs
      description: The same JWT (token_id) was used successfully from several source IPs - likely a stolen token.
      severity: HIGH
      window: 10m
      threshold: 3
      group-by: token_id
      distinct-field: source_ip
      min-distinct: 3
      match:
        event_type: [HTTP_REQUEST]
        outcome: [SUCCESS]
      mitre: T1550.001

    - id: INJECTION_ATTEMPT
      name: Injection payloads in requests
      description: SQL injection, XSS, path traversal or command injection payloads blocked by input inspection.
      severity: HIGH
      window: 5m
      threshold: 3
      escalate-at: 20
      escalate-to: CRITICAL
      group-by: source_ip
      match:
        event_type: [MALICIOUS_REQUEST]
        attack_type: [sql_injection, xss, path_traversal, command_injection]
      mitre: T1190

    - id: LOG4SHELL_EXPLOIT
      name: Log4Shell (JNDI) exploitation attempt
      # Do not write the dollar-brace JNDI syntax here: Spring would treat it as a config placeholder.
      description: A JNDI lookup expression was sent (CVE-2021-44228). A single attempt is enough to alert.
      severity: CRITICAL
      window: 10m
      threshold: 1
      group-by: source_ip
      match:
        event_type: [MALICIOUS_REQUEST]
        attack_type: [jndi_injection]
      mitre: T1190

    - id: SCANNER_TOOL
      name: Security scanner detected
      description: Requests carrying the user agent of an automated attack/scanning tool (sqlmap, nikto, nuclei...).
      severity: MEDIUM
      window: 5m
      threshold: 5
      group-by: source_ip
      match:
        event_type: [MALICIOUS_REQUEST]
        attack_type: [scanner_tool]
      mitre: T1595.002

    - id: RECON_PATH_SCAN
      name: Directory / endpoint discovery
      description: One source requested many different non-existent or forbidden paths (.env, .git, wp-admin...).
      severity: MEDIUM
      window: 2m
      threshold: 10
      group-by: source_ip
      distinct-field: http_path
      min-distinct: 10
      match:
        event_type: [HTTP_REQUEST]
        http_status: ["401", "403", "404"]
      mitre: T1595.003

    - id: DATA_SCRAPING
      name: Bulk data access by one user
      description: An authenticated user read an unusual number of order records in a short period (possible exfiltration).
      severity: HIGH
      window: 1m
      threshold: 40
      group-by: username
      path-prefix: /api/orders
      match:
        event_type: [HTTP_REQUEST]
        http_method: [GET]
        http_status: ["200"]
      mitre: T1213

    - id: JWT_ALG_NONE
      name: Unsigned JWT (alg=none) forgery
      description: A token with no signature was presented - an attempt to forge credentials.
      severity: HIGH
      window: 10m
      threshold: 1
      group-by: source_ip
      match:
        event_type: [TOKEN_INVALID]
        reason: [UnsupportedJwtException]
      mitre: T1606.001
