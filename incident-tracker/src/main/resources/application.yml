server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: incident-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/soc}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    service-api-key: ${TRACKER_API_KEY}
    analysts:
      - username: analyst1
        password: ${ANALYST1_PASSWORD}
        display-name: Tier-1 Analyst
        roles: [ANALYST]
      - username: lead
        password: ${SOC_LEAD_PASSWORD}
        display-name: SOC Lead
        roles: [ANALYST, LEAD]

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
